<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rotating Windmill Blades - Math Animation</title>
  <!-- Load p5.js through CDN before loading sketch.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body style="font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 16px;">

  <h1>Rotating Windmill Blades (Angles &amp; Rotation)</h1>
  <p><strong>IT3 Final Drill:</strong> Math-Based Animation in p5.js</p>

  <!-- p5.js Canvas renders here -->
  <main id="canvas-container"></main>

  <h3>Controls</h3>
  <ul>
    <li><strong>SPACE:</strong> Pause / Resume rotation</li>
    <li><strong>A / D:</strong> Increase / Decrease angular speed</li>
    <li><strong>Q:</strong> Reverse rotation direction (Clockwise / Counter-Clockwise)</li>
    <li><strong>R:</strong> Reset angle and speed</li>
  </ul>


  <!-- Load sketch.js after p5.js -->
  <script src="sketch.js"></script>
</body>
</html>
